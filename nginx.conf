# UI statis + proxy `/api/` ke backend. Ganti `backend:7100` dengan nama layanan dan port backend Anda.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # add_header di dalam location MENIMPA yang di level server, jadi berkas ini di-include di tiap location.
    include /etc/nginx/security-headers.conf;

    # Alamat backend dicari ulang tiap 10 detik (resolver Docker). Tanpa ini nginx menyimpan IP lama dan menjawab 502
    # setelah kontainer backend dibuat ulang (rebuild/deploy) sampai frontend ikut di-restart.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:7100;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
