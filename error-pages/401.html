<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Perlu masuk - Starter Kit</title>
<style>
:root{--color-primary:oklch(0.45 0.16 265);--color-primary-hover:oklch(0.4 0.16 265);--color-primary-soft:oklch(0.96 0.02 265);--color-surface:#ffffff;--color-canvas:oklch(0.975 0.003 260);--color-line:oklch(0.92 0.006 260);--color-ink:oklch(0.24 0.02 265);--color-muted:oklch(0.53 0.02 265);--color-danger:oklch(0.55 0.2 27);--color-danger-soft:oklch(0.97 0.02 27);--color-danger-line:oklch(0.88 0.06 27);--color-danger-ink:oklch(0.45 0.16 27);--color-success:oklch(0.55 0.14 155);--color-success-soft:oklch(0.97 0.025 155);--color-success-line:oklch(0.88 0.07 155);--color-success-ink:oklch(0.42 0.1 155);--color-warning:oklch(0.62 0.14 75);--color-warning-soft:oklch(0.97 0.03 90);--color-warning-line:oklch(0.88 0.08 85);--color-warning-ink:oklch(0.45 0.1 70);--color-info:oklch(0.55 0.15 250);--color-info-soft:oklch(0.97 0.02 250);--color-info-line:oklch(0.88 0.06 250);--color-info-ink:oklch(0.42 0.12 250);--color-chart-1:oklch(0.45 0.16 265);--color-chart-2:oklch(0.58 0.1 195);--color-chart-3:oklch(0.62 0.14 75);--color-chart-4:oklch(0.52 0.14 330);--color-chart-5:oklch(0.55 0.03 265)}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--color-canvas);color:var(--color-ink);font-family:'Instrument Sans Variable','Instrument Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:1.5rem 1rem 2rem}
.brand{display:flex;align-items:center;justify-content:center;gap:.5rem}
.mark{display:flex;width:2rem;height:2rem;align-items:center;justify-content:center;border-radius:.5rem;background:var(--color-primary);color:#fff;font-size:.8125rem;font-weight:700}
.name{font-size:1rem;font-weight:600}
main{flex:1;width:100%;max-width:28rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 0;text-align:center}
svg{width:20rem;max-width:100%;height:auto}
@media(min-width:640px){svg{width:24rem}}
.badge{margin:.5rem 0 0;padding:.125rem .625rem;border-radius:999px;background:var(--color-primary-soft);color:var(--color-primary);font-size:.6875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
h1{margin:.75rem 0 0;font-size:1.375rem;font-weight:600}
@media(min-width:640px){h1{font-size:1.625rem}}
p.d{margin:.5rem 0 0;max-width:24rem;font-size:.8125rem;line-height:1.6;color:var(--color-muted)}
a.b{display:inline-flex;height:2rem;align-items:center;justify-content:center;margin-top:1.5rem;padding:0 1rem;border-radius:.375rem;background:var(--color-primary);color:#fff;font-size:.8125rem;font-weight:500;text-decoration:none}
a.b:hover{background:var(--color-primary-hover)}
@media(max-width:639px){a.b{width:100%}}
</style>
</head>
<body>
<div class="page">
<div class="brand"><span class="mark">S</span><span class="name">Starter Kit</span></div>
<main>
<svg viewBox="0 0 240 180" role="presentation" aria-hidden="true" focusable="false"><circle cx="120" cy="92" r="72" fill="var(--color-primary-soft)"></circle><ellipse cx="120" cy="164" rx="64" ry="7" fill="var(--color-line)" opacity="0.7"></ellipse><circle cx="34" cy="52" r="4" fill="var(--color-line)"></circle><circle cx="210" cy="36" r="3" fill="var(--color-line)"></circle><path d="M206 120h10M211 115v10" stroke="var(--color-line)" stroke-width="3" stroke-linecap="round"></path><path d="M28 112h8M32 108v8" stroke="var(--color-line)" stroke-width="3" stroke-linecap="round"></path><rect x="58" y="46" width="124" height="84" rx="11" fill="var(--color-surface)" stroke="var(--color-line)" stroke-width="3"></rect><circle cx="94" cy="76" r="13" fill="var(--color-primary-soft)"></circle><path d="M72 112a22 22 0 0 1 44 0z" fill="var(--color-primary-soft)"></path><rect x="128" y="66" width="42" height="6" rx="3" fill="var(--color-line)"></rect><rect x="128" y="80" width="30" height="6" rx="3" fill="var(--color-line)"></rect><rect x="128" y="94" width="38" height="6" rx="3" fill="var(--color-line)"></rect><circle cx="176" cy="128" r="20" fill="var(--color-primary)"></circle><rect x="167" y="127" width="18" height="14" rx="3.5" fill="var(--color-surface)"></rect><path d="M171 127v-4a5 5 0 0 1 10 0v4" fill="none" stroke="var(--color-surface)" stroke-width="3.5" stroke-linecap="round"></path></svg>
<p class="badge">Kode 401</p>
<h1>Perlu masuk</h1>
<p class="d">Sesi Anda belum atau sudah tidak aktif. Silakan masuk untuk melanjutkan.</p>
<a class="b" href="/login">Masuk</a>
</main>
</div>
</body>
</html>
